name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 静态分析与类型检查
        run: |
          make check

      - name: 运行单元测试
        run: |
          go test -v ./...

      - name: 构建面板与薄壳安装包
        run: |
          make packages

      - name: 校验 LuCI 契约断言
        run: |
          make check-luci
          make check-ipk-luci

      - name: OpenWrt 模拟安装升级测试
        run: |
          make test-pkg
